name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A2 的验收标准是「SQLite/PostgreSQL 两端契约一致」，
    # 因此 CI 必须真的跑一遍 PostgreSQL，不能让 PG 分支被跳过。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eap_workflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eap_workflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      WORKFLOW_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/eap_workflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev
      - name: Validate Helm chart
        run: |
          helm lint deploy/helm
          helm template eap deploy/helm > /dev/null
