# =============================================================================
# AgentScope Web UI 静态服务 + 反向代理
#
# 依据《建设方案》2.1（单一前端）与 4.1（ChatModel / Toolkit 全部指向网关）：
#   · /            前端静态资源（SPA fallback）
#   · /api/        AgentScope Service（会话管理、HITL 人工确认）
#   · /v1/         agentgateway（OpenAI 兼容接口 + MCP 治理）
#   · /healthz     容器健康检查
# =============================================================================
server {
    listen       5173;
    listen       [::]:5173;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # —— 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # —— AgentScope Service（AG-UI SSE）
    location /ag-ui {
        proxy_pass         http://agent-core:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }

    # —— AgentScope Service
    location /api/ {
        proxy_pass         http://agent-core:8090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering    off;
    }

    # —— agentgateway（OpenAI 兼容 / MCP）
    location /v1/ {
        proxy_pass         http://agentgateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
    }

    # —— 前端静态资源（SPA 路由回退到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # —— 静态资源缓存
    location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
