[general]
# —— RAGFlow 专用 Infinity 0.6.x 实例配置 ——
# 平台侧检索引擎用 0.7.5（ragflow/infinity_conf.toml）；
# RAGFlow v0.22.1 内置的 infinity-sdk 客户端线上协议版本为 0.6.7，
# 与 0.7.5 服务端握手失败，需要单独的 0.6.x 实例。
#
# 注意：这里的 version 是「线上协议版本索引」，不是发布版本号。
# v0.6.5 镜像的二进制默认值可接受 0.6.7 客户端；显式写成 "0.6.5" 会导致
# 服务端拒绝 0.6.7 客户端，表现为 Thrift recv_Connect 一直阻塞（不报错、不返回）。
version                  = "0.6.7"
time_zone                = "utc-8"

[network]
server_address           = "0.0.0.0"
postgres_port            = 5432
http_port                = 23820
client_port              = 23817
# —— 连接上限必须大于 RAGFlow 侧预建连接数总和 ——
# RAGFlow 每个进程在 init_settings() 里建一个 ConnectionPool(max_size=N)，
# 而 infinity-sdk 的 ConnectionPool.__init__ 会**预建** N 条 Thrift 连接：
#     for i in range(max_size):
#         self._create_conn()
# 容器内 3 个进程（ragflow_server / sync_data_source / task_executor）各建一份，
# 总数 = 3 × N。一旦超过这里的连接上限，第 3 个进程（task_executor，
# 唯一注册 Redis 消费者的进程）的首条连接会被 accept 但永不响应 →
# thrift recv_Connect 永久阻塞 → 解析任务全部堆积不消费。
# 当前 RAGFlow 侧已由 eap-entrypoint.sh 把 N 收敛到 8（3×8=24），
# 这里再留 10 倍余量（256）作为纵深防御。
connection_pool_size     = 256

[log]
log_filename             = "infinity.log"
log_dir                  = "/var/infinity/log"
log_to_stdout            = true
log_file_max_size        = "100MB"
log_file_rotate_count    = 10
log_level                = "info"

[storage]
persistence_dir          = "/var/infinity/persistence"
data_dir                 = "/var/infinity/data"
optimize_interval        = "10s"
cleanup_interval         = "60s"
compact_interval         = "120s"
storage_type             = "local"
mem_index_capacity       = 16384

[buffer]
# 本机内存有限（4C/31G），RAGFlow 实例的缓冲按小规格配
buffer_manager_size      = "1GB"
lru_num                  = 4
temp_dir                 = "/var/infinity/tmp"
result_cache             = "off"
memindex_memory_quota    = "256MB"

[wal]
wal_dir                  = "/var/infinity/wal"

[resource]
resource_dir             = "/var/infinity/resource"
