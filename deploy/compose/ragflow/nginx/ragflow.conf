# RAGFlow 站点配置（对齐上游 v0.22.1 docker/nginx/ragflow.conf）
#
# 三段职责：
#   1. /api/v1/admin → 9381 管理面（本部署未启用，保留上游定义）
#   2. /v1 与 /api  → 9380 后端 API（ragflow_server.py）
#   3. 其余路径     → /ragflow/web/dist 静态资源 + SPA 回退到 index.html
#
# 注意 3 的 SPA 回退：RAGFlow 前端是单页应用，刷新 /conversation/xxx 这类
# 深链时磁盘上没有对应文件，必须 try_files 兜到 /index.html，否则前端
# 路由会 404 白屏。
server {
    listen 80;
    server_name _;
    root /ragflow/web/dist;

    # 宿主机把容器 80 映射到 8095。nginx 默认会把重定向的 Location 绝对化，
    # 并按容器内的监听端口拼 URL（80 是 http 默认端口 → 直接省略），
    # 结果浏览器被导向 http://<host>/login-sso.html（端口丢失）。
    # 关掉绝对化，让 Location 保持相对路径，由浏览器按当前 origin（含 8095）解析。
    absolute_redirect off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    location ~ ^/api/v1/admin {
        proxy_pass http://localhost:9381;
        include proxy.conf;
    }

    location ~ ^/(v1|api) {
        proxy_pass http://localhost:9380;
        include proxy.conf;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # —— Keycloak 单点登录拦截 ——
    # 由 eap-entrypoint.sh 生成 /etc/nginx/sso/ragflow-sso.conf（启用 SSO 时才生成），
    # 内容是 /login 的拦截规则：访问登录页直接跳企业账号登录，并保留 ?local=1 走本地表单。
    # 用通配符 include：未启用 SSO 时没有该文件，匹配不到任何内容，不影响 nginx 启动。
    include /etc/nginx/sso/*.conf;

    # Cache-Control: max-age~@~AExpires
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}
