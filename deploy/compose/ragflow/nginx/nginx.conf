# RAGFlow 官方 nginx 主配置（对齐上游 v0.22.1 docker/nginx/nginx.conf）
#
# ── 为什么必须覆盖镜像自带的配置 ───────────────────────────────────
# infiniflow/ragflow:v0.22.1 镜像里的 /etc/nginx/ 是 Debian 默认站点：
#   - nginx.conf     → Debian 模板（server 块在 sites-enabled/default）
#   - conf.d/        → 空目录，没有 RAGFlow 的站点配置
#   - sites-enabled/default → root /var/www/html，只有 index.nginx-debian.html
#
# 于是容器内 nginx 启动后 80 端口返回的是 "Welcome to nginx!" 默认页，
# 而 RAGFlow 前端产物在 /ragflow/web/dist（完整存在，index.html 也在）。
# 官方 Dockerfile 应当把 docker/nginx/* 复制进 /etc/nginx/，本镜像实际没有，
# 因此这里以只读挂载的方式补齐，让 Web 界面与 API 代理真正可用。
#
# 与上游的差异：
#   1. 去掉 include /etc/nginx/conf.d/ragflow.conf 之外的任何默认站点
#      （由本文件整体替换 nginx.conf，sites-enabled/default 不再被加载）
#   2. /api/v1/admin 代理到 9381（本部署未开启 --enable-adminserver），
#      保留上游定义以便日后启用管理面时无需再改配置
user  root;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;
    client_max_body_size 1024M;

    include /etc/nginx/conf.d/ragflow.conf;
}
