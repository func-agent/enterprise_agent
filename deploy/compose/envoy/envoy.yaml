# =============================================================================
# 出网代理配置 —— Envoy（唯一出网组件）
#
# 依据《企业级 AI Agent 平台建设方案》：
#   8.3 出网安全：出网代理是唯一出口，SNI 域名白名单 + TLS 解密审计
#   9.3 网络要求：业务组件禁止直连商业 API，必须经过 agentgateway + 出网代理
#
# 监听：
#   15000  HTTP 正向代理（明文 HTTP 转发 + CONNECT 隧道，按 :authority 白名单过滤）
#   15001  HTTPS 代理（TLS inspector 读取 SNI → filter_chain_match 白名单 → 解密审计）
#   9901   管理接口（/ready、/stats、/config_dump）
#
# 白名单不在本文件里写死：由 entrypoint.sh 依据环境变量 EGRESS_ALLOWED_HOSTS
# 调用 render-allowlist.awk 重新生成下面三个区块（逗号分隔，默认值见 .env.example）：
#   ALLOWED HTTP VHOSTS —— 15000 监听器的白名单虚拟主机
#   ALLOWED SNI CHAINS  —— 15001 监听器的白名单过滤链（filter_chain_match）
#   EGRESS CLUSTERS     —— 每个白名单域名对应的上游集群
# 白名单之外的 SNI / Host 直接返回 403。
#
# 模板域名使用 api.openai.com，渲染时整体替换为实际白名单域名。
# =============================================================================

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

static_resources:
  listeners:
    # -------------------------------------------------------------------------
    # 15000 —— HTTP 正向代理
    #   · 普通 HTTP 请求：按 :authority（Host）匹配白名单 → 走 80 端口上游
    #   · CONNECT 隧道：按 :authority 匹配白名单 → 走 443 端口原始 TCP 隧道
    #     （隧道内 TLS 由客户端端到端承载，网关不做解密；解密审计走 15001）
    # -------------------------------------------------------------------------
    - name: egress_http_proxy
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15000
      filter_chains:
        - name: egress_http_chain
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_http
                codec_type: AUTO
                use_remote_address: true
                # 允许 CONNECT 隧道（正向代理的 https 转发方式）
                upgrade_configs:
                  - upgrade_type: CONNECT
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-http] method=%REQ(:METHOD)% authority=%REQ(:AUTHORITY)% sni=%REQUESTED_SERVER_NAME% upstream=%UPSTREAM_HOST% response=%RESPONSE_CODE% duration_ms=%DURATION%\n"
                route_config:
                  name: egress_http_routes
                  virtual_hosts:
                    # >>> ALLOWED HTTP VHOSTS BEGIN
                    - name: allow_api_openai_com
                      domains:
                        - api.openai.com
                        - api.openai.com:*
                      routes:
                        # CONNECT 隧道：客户端 TLS 端到端，网关只做域名白名单管控
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: ":authority"
                                string_match:
                                  safe_regex:
                                    regex: '^api\.openai\.com(:443)?$'
                          route:
                            cluster: egress_connect_api_openai_com
                            timeout: 120s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        # 明文 HTTP
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_http_api_openai_com
                            timeout: 120s
                    - name: allow_dashscope_aliyuncs_com
                      domains:
                        - dashscope.aliyuncs.com
                        - dashscope.aliyuncs.com:*
                      routes:
                        # CONNECT 隧道：客户端 TLS 端到端，网关只做域名白名单管控
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: ":authority"
                                string_match:
                                  safe_regex:
                                    regex: '^dashscope\.aliyuncs\.com(:443)?$'
                          route:
                            cluster: egress_connect_dashscope_aliyuncs_com
                            timeout: 120s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        # 明文 HTTP
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_http_dashscope_aliyuncs_com
                            timeout: 120s
                    - name: allow_api_deepseek_com
                      domains:
                        - api.deepseek.com
                        - api.deepseek.com:*
                      routes:
                        # CONNECT 隧道：客户端 TLS 端到端，网关只做域名白名单管控
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: ":authority"
                                string_match:
                                  safe_regex:
                                    regex: '^api\.deepseek\.com(:443)?$'
                          route:
                            cluster: egress_connect_api_deepseek_com
                            timeout: 120s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        # 明文 HTTP
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_http_api_deepseek_com
                            timeout: 120s
                    - name: allow_open_bigmodel_cn
                      domains:
                        - open.bigmodel.cn
                        - open.bigmodel.cn:*
                      routes:
                        # CONNECT 隧道：客户端 TLS 端到端，网关只做域名白名单管控
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: ":authority"
                                string_match:
                                  safe_regex:
                                    regex: '^open\.bigmodel\.cn(:443)?$'
                          route:
                            cluster: egress_connect_open_bigmodel_cn
                            timeout: 120s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        # 明文 HTTP
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_http_open_bigmodel_cn
                            timeout: 120s
                    - name: allow_agent_minimaxi_com
                      domains:
                        - agent.minimaxi.com
                        - agent.minimaxi.com:*
                      routes:
                        # CONNECT 隧道：客户端 TLS 端到端，网关只做域名白名单管控
                        - match:
                            connect_matcher: {}
                            headers:
                              - name: ":authority"
                                string_match:
                                  safe_regex:
                                    regex: '^agent\.minimaxi\.com(:443)?$'
                          route:
                            cluster: egress_connect_agent_minimaxi_com
                            timeout: 120s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        # 明文 HTTP
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_http_agent_minimaxi_com
                            timeout: 120s
                    # <<< ALLOWED HTTP VHOSTS END
                    # —— 白名单外：直接 403（见 8.3）
                    - name: default_deny
                      domains:
                        - "*"
                      routes:
                        - match:
                            connect_matcher: {}
                          direct_response:
                            status: 403
                            body:
                              inline_string: "EAP egress denied: host not in egress allowlist\n"
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: "EAP egress denied: host not in egress allowlist\n"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # -------------------------------------------------------------------------
    # 15001 —— HTTPS 代理（TLS 解密审计）
    #   · tls_inspector 读取客户端 SNI
    #   · filter_chain_match.server_names 做白名单匹配（每个域名一条 chain）
    #   · 白名单内：Envoy 用企业 CA 签发的证书解密，再以 TLS 原文转发到真实上游
    #   · 白名单外：默认 chain 解密后直接返回 403
    # -------------------------------------------------------------------------
    - name: egress_https_proxy
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 15001
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        # —— 默认拒绝链（不在白名单的 SNI 走这里，解密后返回 403）
        #    同时在此定义 TLS 证书 anchor，供后续允许链复用
        - name: default_deny
          transport_socket: &downstream_tls
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/certs/server.crt
                    private_key:
                      filename: /etc/envoy/certs/server.key
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_denied
                codec_type: AUTO
                use_remote_address: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-denied] sni=%REQUESTED_SERVER_NAME% authority=%REQ(:AUTHORITY)% response=403\n"
                route_config:
                  name: egress_denied_routes
                  virtual_hosts:
                    - name: default_deny
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: "EAP egress denied: SNI not in egress allowlist\n"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        # >>> ALLOWED SNI CHAINS BEGIN
        - name: allow_api_openai_com
          filter_chain_match:
            server_names:
              - api.openai.com
          transport_socket: *downstream_tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_https
                codec_type: AUTO
                use_remote_address: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-https] sni=%REQUESTED_SERVER_NAME% authority=%REQ(:AUTHORITY)% upstream=%UPSTREAM_HOST% response=%RESPONSE_CODE% duration_ms=%DURATION%\n"
                route_config:
                  name: egress_https_routes
                  virtual_hosts:
                    - name: allowlist
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_tls_api_openai_com
                            timeout: 120s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: allow_dashscope_aliyuncs_com
          filter_chain_match:
            server_names:
              - dashscope.aliyuncs.com
          transport_socket: *downstream_tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_https
                codec_type: AUTO
                use_remote_address: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-https] sni=%REQUESTED_SERVER_NAME% authority=%REQ(:AUTHORITY)% upstream=%UPSTREAM_HOST% response=%RESPONSE_CODE% duration_ms=%DURATION%\n"
                route_config:
                  name: egress_https_routes
                  virtual_hosts:
                    - name: allowlist
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_tls_dashscope_aliyuncs_com
                            timeout: 120s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: allow_api_deepseek_com
          filter_chain_match:
            server_names:
              - api.deepseek.com
          transport_socket: *downstream_tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_https
                codec_type: AUTO
                use_remote_address: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-https] sni=%REQUESTED_SERVER_NAME% authority=%REQ(:AUTHORITY)% upstream=%UPSTREAM_HOST% response=%RESPONSE_CODE% duration_ms=%DURATION%\n"
                route_config:
                  name: egress_https_routes
                  virtual_hosts:
                    - name: allowlist
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_tls_api_deepseek_com
                            timeout: 120s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: allow_open_bigmodel_cn
          filter_chain_match:
            server_names:
              - open.bigmodel.cn
          transport_socket: *downstream_tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_https
                codec_type: AUTO
                use_remote_address: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-https] sni=%REQUESTED_SERVER_NAME% authority=%REQ(:AUTHORITY)% upstream=%UPSTREAM_HOST% response=%RESPONSE_CODE% duration_ms=%DURATION%\n"
                route_config:
                  name: egress_https_routes
                  virtual_hosts:
                    - name: allowlist
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_tls_open_bigmodel_cn
                            timeout: 120s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        - name: allow_agent_minimaxi_com
          filter_chain_match:
            server_names:
              - agent.minimaxi.com
          transport_socket: *downstream_tls
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: egress_https
                codec_type: AUTO
                use_remote_address: true
                internal_address_config:
                  cidr_ranges:
                    - address_prefix: 10.0.0.0
                      prefix_len:
                        value: 8
                    - address_prefix: 172.16.0.0
                      prefix_len:
                        value: 12
                    - address_prefix: 192.168.0.0
                      prefix_len:
                        value: 16
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[egress-https] sni=%REQUESTED_SERVER_NAME% authority=%REQ(:AUTHORITY)% upstream=%UPSTREAM_HOST% response=%RESPONSE_CODE% duration_ms=%DURATION%\n"
                route_config:
                  name: egress_https_routes
                  virtual_hosts:
                    - name: allowlist
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: egress_tls_agent_minimaxi_com
                            timeout: 120s
                            idle_timeout: 60s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # <<< ALLOWED SNI CHAINS END

  clusters:
    # >>> EGRESS CLUSTERS BEGIN
    - name: egress_http_api_openai_com
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: egress_http_api_openai_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.openai.com
                      port_value: 80
      transport_socket:
        name: envoy.transport_sockets.raw_buffer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer

    # —— CONNECT 隧道上游（原始 TCP，TLS 由客户端端到端承载）
    - name: egress_connect_api_openai_com
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: egress_connect_api_openai_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.openai.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.raw_buffer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer

    # —— TLS 解密后重新加密转发上游（校验上游证书）
    - name: egress_tls_api_openai_com
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: egress_tls_api_openai_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: api.openai.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: api.openai.com
          common_tls_context:
            validation_context:
              trusted_ca:
                filename: /etc/ssl/certs/ca-certificates.crt
    # —— 明文 HTTP 上游
    - name: egress_http_dashscope_aliyuncs_com
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: egress_http_dashscope_aliyuncs_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashscope.aliyuncs.com
                      port_value: 80
      transport_socket:
        name: envoy.transport_sockets.raw_buffer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer

    # —— CONNECT 隧道上游（原始 TCP，TLS 由客户端端到端承载）
    - name: egress_connect_dashscope_aliyuncs_com
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: egress_connect_dashscope_aliyuncs_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashscope.aliyuncs.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.raw_buffer
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.raw_buffer.v3.RawBuffer

    # —— TLS 解密后重新加密转发上游（校验上游证书）
    - name: egress_tls_dashscope_aliyuncs_com
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      connect_timeout: 5s
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: egress_tls_dashscope_aliyuncs_com
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: dashscope.aliyuncs.com
                      port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
          sni: dashscope.aliyuncs.com
          common_tls_context:
