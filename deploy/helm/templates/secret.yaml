{{/* ===================================================================
  占位密钥 Secret
  —— 说明（见 3.2 明确排除的组件及理由）：
     本方案**不引入 Vault**，生产环境使用 K8s Secret / 环境变量托管 + 季度人工轮换
     （见 8.5 凭证安全）。本模板中的值全部是占位符（CHANGE_ME_*），仅供 POC 使用。
     生产落地方式：
       1) values 中设置 secrets.existingSecret 指向已由运维创建的 Secret；或
       2) 由企业 CI / Secret 管理流程直接创建同名 Secret，本模板不覆盖。
  =================================================================== */}}
{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eap.fullname" . }}-secret
  namespace: {{ include "eap.ns.support" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
  annotations:
    eap.example.com/placeholder: "true"
    eap.example.com/note: "占位密钥，生产必须替换为 K8s Secret / 季度轮换流程"
type: Opaque
stringData:
  # —— 存储层
  postgres-password: {{ .Values.supportLayer.postgres.auth.password | quote }}
  postgres-username: {{ .Values.supportLayer.postgres.auth.username | quote }}
  postgres-database: {{ .Values.supportLayer.postgres.auth.database | quote }}
  redis-password: {{ .Values.supportLayer.redis.auth.password | quote }}
  minio-root-user: {{ .Values.supportLayer.minio.auth.rootUser | quote }}
  minio-root-password: {{ .Values.supportLayer.minio.auth.rootPassword | quote }}
  clickhouse-user: {{ .Values.supportLayer.clickhouse.auth.user | quote }}
  clickhouse-password: {{ .Values.supportLayer.clickhouse.auth.password | quote }}
  # —— 身份层
  keycloak-admin-password: {{ .Values.identityLayer.keycloak.auth.adminPassword | quote }}
  # —— 观测层
  langfuse-salt: {{ .Values.observabilityLayer.langfuse.auth.salt | quote }}
  langfuse-encryption-key: {{ .Values.observabilityLayer.langfuse.auth.encryptionKey | quote }}
  nextauth-secret: {{ .Values.observabilityLayer.langfuse.auth.nextauthSecret | quote }}
  # —— 知识层
  ragflow-mysql-password: {{ .Values.knowledgeLayer.ragflow.mysql.password | quote }}
{{- end }}

{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eap.fullname" . }}-secret
  namespace: {{ include "eap.ns.app" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-url: {{ printf "postgresql://%s:%s@%s-postgres.%s.svc:%v/%s" .Values.supportLayer.postgres.auth.username .Values.supportLayer.postgres.auth.password (include "eap.fullname" .) (include "eap.ns.support" .) .Values.supportLayer.postgres.service.port .Values.supportLayer.postgres.auth.database | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis.%s.svc:%v" .Values.supportLayer.redis.auth.password (include "eap.fullname" .) (include "eap.ns.support" .) .Values.supportLayer.redis.service.port | quote }}
  minio-root-user: {{ .Values.supportLayer.minio.auth.rootUser | quote }}
  minio-root-password: {{ .Values.supportLayer.minio.auth.rootPassword | quote }}
  langfuse-public-key: {{ .Values.observabilityLayer.langfuse.auth.publicKey | quote }}
  langfuse-secret-key: {{ .Values.observabilityLayer.langfuse.auth.secretKey | quote }}
  keycloak-user-admin-client-secret: {{ .Values.identityLayer.keycloak.auth.userAdminClientSecret | quote }}
{{- end }}

{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eap.fullname" . }}-secret
  namespace: {{ include "eap.ns.data" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-username: {{ .Values.supportLayer.postgres.auth.username | quote }}
  postgres-password: {{ .Values.supportLayer.postgres.auth.password | quote }}
  postgres-database: {{ .Values.supportLayer.postgres.auth.database | quote }}
  redis-password: {{ .Values.supportLayer.redis.auth.password | quote }}
  minio-root-user: {{ .Values.supportLayer.minio.auth.rootUser | quote }}
  minio-root-password: {{ .Values.supportLayer.minio.auth.rootPassword | quote }}
  ragflow-mysql-password: {{ .Values.knowledgeLayer.ragflow.mysql.password | quote }}
{{- end }}

{{/* —— 商业模型 API Key（仅注入 agentgateway，见 8.5 凭证安全 / 2.1 单一网关） —— */}}
{{- if and .Values.gatewayLayer.gateway.enabled (not .Values.secrets.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eap.fullname" . }}-llm-keys
  namespace: {{ include "eap.ns.app" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
  annotations:
    eap.example.com/placeholder: "true"
    eap.example.com/note: "商业大模型 API Key 托管点，仅 agentgateway 可见"
type: Opaque
stringData:
  QWEN_API_KEY: {{ .Values.gatewayLayer.gateway.providerCredentials.qwen | quote }}
  DEEPSEEK_API_KEY: {{ .Values.gatewayLayer.gateway.providerCredentials.deepseek | quote }}
  ZHIPU_API_KEY: {{ .Values.gatewayLayer.gateway.providerCredentials.zhipu | quote }}
  OPENAI_API_KEY: {{ .Values.gatewayLayer.gateway.providerCredentials.openai | quote }}
  MINIMAX_API_KEY: {{ .Values.gatewayLayer.gateway.providerCredentials.minimax | quote }}
{{- end }}

{{/* —— 出网代理 TLS 解密证书（生产请注入企业 CA 签发的证书，见 8.3 出网安全） —— */}}
{{- if and .Values.securityLayer.envoy.enabled (not .Values.securityLayer.envoy.tls.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eap.fullname" . }}-envoy-tls
  namespace: {{ include "eap.ns.app" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
  annotations:
    eap.example.com/placeholder: "true"
    eap.example.com/note: "出网代理 TLS 解密证书占位；生产使用企业 CA 签发证书"
type: Opaque
stringData:
  tls.crt: ""
  tls.key: ""
{{- end }}
