{{/* ===================================================================
  AgentScope Web UI —— 唯一用户入口（见 2.1「单一前端」/ 3.1 组件总览）
  =================================================================== */}}
{{- if .Values.appLayer.webui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eap.fullname" . }}-webui
  namespace: {{ include "eap.ns.app" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  replicas: {{ .Values.appLayer.webui.replicaCount }}
  selector:
    matchLabels:
      {{- include "eap.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        {{- include "eap.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      {{- include "eap.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: webui
          image: {{ include "eap.image" (dict "root" . "repository" .Values.appLayer.webui.image.repository "tag" .Values.appLayer.webui.image.tag) }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.appLayer.webui.service.port }}
              protocol: TCP
          env:
            - name: WEBUI_PORT
              value: {{ .Values.appLayer.webui.service.port | quote }}
            - name: WEBUI_API_BASE_URL
              value: {{ printf "http://%s-agent-core.%s.svc:%v" (include "eap.fullname" .) (include "eap.ns.app" .) .Values.appLayer.agentCore.service.port | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.appLayer.webui.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "eap.fullname" . }}-webui-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eap.fullname" . }}-webui
  namespace: {{ include "eap.ns.app" . }}
  labels:
    {{- include "eap.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  type: ClusterIP
  selector:
    {{- include "eap.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: webui
  ports:
    - name: http
      port: {{ .Values.appLayer.webui.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
